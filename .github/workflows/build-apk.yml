name: Build Mehek Car APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Mehek Car Android source
        run: |
          unzip -q "MehekCarAndroid_Project_Themes_Logo.zip" -d "$GITHUB_WORKSPACE"
          test -f "MehekCarAndroid/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMGR=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        working-directory: MehekCarAndroid
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Mehek-Car-debug-APK
          path: MehekCarAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
